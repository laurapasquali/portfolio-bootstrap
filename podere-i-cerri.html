  <!-- anno del copyright: si aggiorna da solo; se lo script non parte resta quello scritto nel footer.
       Torna su: scorrimento morbido con Lenis; senza JavaScript il link # porta comunque in cima -->
  <script>
    {
      const anno = document.getElementById('anno');
      if (anno) anno.textContent = new Date().getFullYear();

      const tornaSu = document.querySelector('.torna-su');
      if (tornaSu) {
        tornaSu.addEventListener('click', (evento) => {
          evento.preventDefault();
          // chi ha attivato "riduci movimento" torna su con un salto, senza animazione
          const ridotto = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          if (typeof lenis !== 'undefined') {
            lenis.scrollTo(0, { immediate: ridotto });
          } else {
            window.scrollTo({ top: 0, behavior: ridotto ? 'auto' : 'smooth' });
          }
        });
      }
    }
  </script>
